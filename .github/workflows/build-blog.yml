name: Build Blog

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
      - 'src/**'
      - 'package.json'
      - 'astro.config.mjs'
      - 'scripts/**'
      - '.publication/**'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run test:publication

      - run: npm run build:pages

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-output
          path: .pages-output/
          include-hidden-files: true
