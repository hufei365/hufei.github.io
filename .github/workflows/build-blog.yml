name: Build Blog

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
      - 'src/**'
      - 'package.json'
      - 'astro.config.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx astro build

      - name: Merge build output into blog/
        run: |
          # Copy Astro-generated files into the existing blog/ directory
          cp -r dist-blog/* blog/
          rm -rf dist-blog

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add blog/
          git diff --cached --quiet || git commit -m "build: astro $(date -u +%Y-%m-%d)"
          git push
